const grid = document.getElementById("grid");
function render(list){
grid.innerHTML="";
list.forEach(p=>{
const card=document.createElement("div");
card.className="card";
card.innerHTML=`<div class="card-content"><div class="tag">${p.category} | ${p.difficulty}</div><h3>${p.name}</h3><div class="materials"><b>Materiales:</b> ${p.materials}</div></div>`;
grid.appendChild(card);
});
}
render(projects);
function filter(){
const s=document.getElementById("search").value.toLowerCase();
const c=document.getElementById("category").value;
const d=document.getElementById("difficulty").value;
const filtered=projects.filter(p=>(p.name.toLowerCase().includes(s)) && (!c || p.category===c) && (!d || p.difficulty===d));
render(filtered);
}
document.getElementById("search").addEventListener("input",filter);
document.getElementById("category").addEventListener("change",filter);
document.getElementById("difficulty").addEventListener("change",filter);
</script>
